# Every push to main whose version (xfpanel/__init__.py) has no Release yet creates
# the tag vX.Y.Z and a GitHub Release. Servers then offer the update.
name: release
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the release if this version is new
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ver="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' xfpanel/__init__.py | tr -d '\r')"
          [[ "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "unreadable version '$ver'"; exit 1; }
          if gh release view "v$ver" >/dev/null 2>&1; then echo "v$ver is already released"; exit 0; fi
          flags=""; [[ "$ver" == *-* ]] && flags="--prerelease"
          gh release create "v$ver" --target "$GITHUB_SHA" --title "v$ver" --generate-notes $flags
